<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<meta name="theme-color" content="#fff4d6">
<title>おえかきモンスターバトル</title>
<style>
:root{--ink:#263044;--pink:#ff7194;--blue:#62b9ff;--yellow:#ffd85b;--paper:#fffdf7}
*{box-sizing:border-box}
body{margin:0;background:#fff4d6;color:var(--ink);font-family:system-ui,-apple-system,"Hiragino Kaku Gothic ProN","Meiryo",sans-serif}
button{font:inherit;font-weight:800;border:0;border-radius:14px;padding:11px 14px;cursor:pointer;touch-action:manipulation;color:var(--ink);box-shadow:0 3px 0 #00000014}
button:active{transform:translateY(2px);box-shadow:0 1px 0 #00000014}
.app{max-width:900px;margin:auto;padding:12px}header{text-align:center;padding:8px 0 12px}
h1{font-size:clamp(1.5rem,5vw,2.2rem);margin:4px 0}.sub{margin:0;font-weight:700}
.panel,.battle{background:#fff;border:3px solid var(--ink);border-radius:20px;padding:13px;margin:12px 0;box-shadow:0 4px 0 #26304418}
h2{font-size:1.15rem;margin:0 0 10px}label{font-weight:800}
.name-row{display:flex;gap:8px;align-items:center;margin-bottom:10px}.name-row input{min-width:0;flex:1;border:2px solid #d8dce5;border-radius:12px;padding:10px;font:inherit}
.canvas-wrap{background:var(--paper);border:2px dashed #c9ced8;border-radius:14px;overflow:hidden}
canvas{display:block;width:100%;touch-action:none}
#drawCanvas{height:420px;cursor:crosshair}
.tools,.actions{display:flex;gap:7px;flex-wrap:wrap;margin:10px 0}.tools button{background:#f0f2f8;padding:8px 10px}.tools button.active{outline:3px solid var(--ink)}
.colors{display:flex;gap:8px;align-items:center;flex-wrap:wrap}.swatch{width:31px;height:31px;border:2px solid #26304455;border-radius:50%;padding:0;box-shadow:none}.swatch.active{outline:3px solid var(--ink);outline-offset:2px}
.primary{background:var(--yellow);flex:1;min-width:150px}.secondary{background:#e9edf5}
.saved{display:grid;grid-template-columns:1fr 1fr;gap:9px}.fighter-card{border:2px solid var(--ink);border-radius:14px;padding:7px;text-align:center;min-width:0}.fighter-card.a{background:#fff0f4}.fighter-card.b{background:#edf7ff}
.fighter-card canvas{height:140px;background:white;border:1px solid #e1e4eb;border-radius:9px}.fighter-card h3{margin:0 0 5px}
.small{font-size:.85rem;color:#5c6577;font-weight:600}
.battle{padding:12px;text-align:center}
.arena{position:relative;overflow:hidden;height:clamp(250px,48vw,360px);border:3px solid #263044;border-radius:17px;background:linear-gradient(#9be1ff 0%,#e7faff 55%,#a9df7a 55%,#77c957 100%);margin:8px 0 12px;isolation:isolate}
.cloud{position:absolute;top:14%;width:65px;height:22px;background:white;border-radius:30px;opacity:.75}.cloud:before,.cloud:after{content:"";position:absolute;bottom:0;background:white;border-radius:50%}.cloud:before{width:28px;height:28px;left:12px}.cloud:after{width:33px;height:33px;left:30px}
.hill{position:absolute;bottom:24%;width:180px;height:60px;background:#8fce72;border-radius:50% 50% 0 0;z-index:-1}.ground{position:absolute;bottom:0;left:0;right:0;height:26%;background:repeating-linear-gradient(0deg,#68b84f 0 7px,#76c85b 7px 14px);border-top:4px solid #4b9b42;z-index:-1}
.base{position:absolute;bottom:10%;width:15%;height:30%;min-width:38px;max-width:95px;border:3px solid #263044;border-radius:12px 12px 5px 5px;background:#fff;box-shadow:inset 0 -12px #e4e9f2;z-index:1}
.base:before{content:"";position:absolute;left:15%;right:15%;top:-17px;height:17px;background:#ffd85b;border:3px solid #263044;border-bottom:0;border-radius:8px 8px 0 0}
.base.a{left:2%}.base.b{right:2%}
.base-label{position:absolute;bottom:2%;font-size:.7rem;font-weight:900}.base-label.a{left:2%}.base-label.b{right:2%}
.unit{position:absolute;bottom:12%;width:44%;height:76%;max-width:320px;display:flex;align-items:end;justify-content:center;z-index:3;transition:left .12s linear,right .12s linear,transform .15s ease;will-change:left,right,transform}
.unit canvas{height:100%;object-fit:contain;background:transparent}
.unit.a{left:8%}.unit.b{right:8%}
.hp-wrap{position:absolute;top:8px;width:37%;z-index:5;text-align:left}.hp-wrap.a{left:8px}.hp-wrap.b{right:8px;text-align:right}
.hp-label{font-size:.8rem;font-weight:900;text-shadow:0 1px white}.hp-track{height:14px;border:2px solid #263044;border-radius:99px;background:#fff;overflow:hidden}.hp-fill{height:100%;width:100%;background:#5cdb75;transition:width .25s ease,background .25s ease}
.battle-status{font-weight:900;min-height:1.6em;margin:4px 0}
.hit-text{font-family:"M PLUS Rounded 1c","Hiragino Maru Gothic ProN","Yu Gothic UI",system-ui,sans-serif;position:absolute;left:50%;top:44%;transform:translate(-50%,-50%) scale(.2);font-size:clamp(2rem,8vw,4rem);font-weight:1000;color:#ff3b5c;text-shadow:3px 3px white,-2px -2px white;opacity:0;z-index:7;pointer-events:none;white-space:nowrap}
.hit-text.show{animation:hitPop .5s ease-out}
.damage{animation:damage .35s ease-in-out}.attack-a{animation:attackA .38s ease-in-out}.attack-b{animation:attackB .38s ease-in-out}.victory{animation:victory .6s ease-in-out 3;filter:drop-shadow(0 0 10px #fff45c)}
@keyframes attackA{0%,100%{transform:translateX(0) scale(1)}45%{transform:translateX(25px) scale(1.12) rotate(5deg)}}
@keyframes attackB{0%,100%{transform:translateX(0) scale(1)}45%{transform:translateX(-25px) scale(1.12) rotate(-5deg)}}
@keyframes damage{0%,100%{transform:translateX(0);filter:brightness(1)}25%{transform:translateX(-8px);filter:brightness(1.8)}50%{transform:translateX(8px);filter:brightness(.65)}75%{transform:translateX(-4px)}}
@keyframes victory{0%,100%{transform:translateY(0) scale(1)}45%{transform:translateY(-14px) scale(1.1)}}
@keyframes hitPop{0%{opacity:0;transform:translate(-50%,-50%) scale(.2) rotate(-12deg)}35%{opacity:1;transform:translate(-50%,-50%) scale(1.1) rotate(8deg)}100%{opacity:0;transform:translate(-50%,-50%) scale(1.5) rotate(18deg)}}
.dice-row{display:grid;grid-template-columns:1fr 1fr;gap:9px;margin:10px 0}.dice-card{border-radius:13px;padding:8px;background:#f4f6fb}.dice{font-size:2rem;font-weight:900}
.result{font-size:clamp(1.3rem,4.5vw,2rem);font-weight:1000;min-height:1.6em;margin:7px 0}
@media(max-width:520px){.app{padding:8px}.panel,.battle{padding:9px}.fighter-card canvas{height:110px}.arena{height:255px}.unit{width:44%;height:68%;bottom:14%}.base{width:13%;height:25%}.hp-wrap{width:40%}.hp-label{font-size:.7rem}}

.unit.transforming{animation:monsterTransform .95s cubic-bezier(.2,.9,.2,1) both;filter:drop-shadow(0 0 10px #fff45c) saturate(1.6)}
.unit.evolved{filter:drop-shadow(0 0 13px #ffcf33) saturate(1.5)}
.unit.power-attack{animation:powerAttack .7s cubic-bezier(.15,.8,.2,1) both}
.unit.flip-spin{animation:monsterFlipSpin .72s ease-in-out both;backface-visibility:visible}
.unit.knockback{animation:knockback .55s ease-out both}
.arena.flash{animation:arenaFlash .32s ease-out}
.hit-text.power{font-size:clamp(2.7rem,11vw,5rem);color:#ff2d55;text-shadow:4px 4px #fff,-3px -3px #fff,0 0 20px #ffd85b}
@keyframes monsterTransform{0%{transform:scale(1)}18%{transform:scale(.78) rotate(-10deg);filter:brightness(2)}42%{transform:scale(1.5) rotate(12deg);filter:brightness(1.8) saturate(2.5) drop-shadow(0 0 20px #fff45c)}65%{transform:scale(1.25) rotate(-6deg)}100%{transform:scale(1.18);filter:drop-shadow(0 0 13px #ffcf33) saturate(1.5)}}
@keyframes powerAttack{0%,100%{transform:translateX(0) scale(1.18)}25%{transform:translateX(0) scale(1.45) rotate(-5deg)}55%{transform:translateX(var(--charge,35px)) scale(1.3) rotate(8deg)}75%{transform:translateX(calc(var(--charge,35px)*.5)) scale(1.15)}}
@keyframes knockback{0%{transform:translateX(0) scale(1)}25%{transform:translateX(24px) scale(.82) rotate(12deg);filter:brightness(2)}60%{transform:translateX(44px) scale(.72) rotate(-12deg);filter:brightness(.6)}100%{transform:translateX(0) scale(.8)}}
@keyframes arenaFlash{0%,100%{filter:none}40%{filter:brightness(1.45) saturate(1.5)}}
@keyframes monsterFlipSpin{0%{transform:scale(1) rotateY(0) rotateZ(0)}25%{transform:scale(1.22) rotateY(180deg) rotateZ(12deg)}50%{transform:scale(1.35) rotateY(360deg) rotateZ(-10deg)}75%{transform:scale(1.18) rotateY(540deg) rotateZ(6deg)}100%{transform:scale(1.18) rotateY(720deg) rotateZ(0)}}
</style>
</head>
<body>
<div class="app">
<header><h1>おえかきモンスターバトル</h1><p class="sub">モンスターをかいて、じぶんの力でバトル！</p></header>
<section class="panel">
<h2 id="drawTitle">① プレイヤー A の絵をかこう</h2>
<div class="name-row"><label for="fighterName">なまえ</label><input id="fighterName" maxlength="12" value="プレイヤー A"></div>
<div class="canvas-wrap"><canvas id="drawCanvas" aria-label="お絵描きキャンバス"></canvas></div>
<div class="tools"><button id="penBtn" class="active">✏️ ペン</button><button id="eraserBtn">消しゴム</button><button id="sizeThinBtn">細い</button><button id="sizeMidBtn" class="active">普通</button><button id="sizeBoldBtn">太い</button><label for="brushSizeRange" style="display:flex;align-items:center;gap:6px;font-size:.9rem">太さ <input id="brushSizeRange" type="range" min="1" max="30" step="0.5" value="5" style="width:130px;accent-color:#263044"><span id="brushSizeValue">5</span></label><button id="undoBtn">1つもどす</button><button id="clearBtn">ぜんぶ消す</button></div>
<div class="colors">
<button class="swatch active" data-color="#263044" style="background:#263044" aria-label="くろ"></button><button class="swatch" data-color="#ff4d6d" style="background:#ff4d6d" aria-label="あか"></button><button class="swatch" data-color="#ff9f1c" style="background:#ff9f1c" aria-label="オレンジ"></button><button class="swatch" data-color="#ffd60a" style="background:#ffd60a" aria-label="きいろ"></button><button class="swatch" data-color="#2ec4b6" style="background:#2ec4b6" aria-label="みどり"></button><button class="swatch" data-color="#3a86ff" style="background:#3a86ff" aria-label="あお"></button><button class="swatch" data-color="#8338ec" style="background:#8338ec" aria-label="むらさき"></button><button class="swatch" data-color="#ff70c5" style="background:#ff70c5" aria-label="ピンク"></button>
<button class="swatch" data-color="#ffffff" style="background:#ffffff" aria-label="しろ"></button><button class="swatch" data-color="#8d99ae" style="background:#8d99ae" aria-label="グレー"></button><button class="swatch" data-color="#5a2a27" style="background:#5a2a27" aria-label="こげちゃ"></button><button class="swatch" data-color="#b5651d" style="background:#b5651d" aria-label="ちゃいろ"></button><button class="swatch" data-color="#ffb703" style="background:#ffb703" aria-label="やまぶき"></button><button class="swatch" data-color="#a7c957" style="background:#a7c957" aria-label="きみどり"></button><button class="swatch" data-color="#0081a7" style="background:#0081a7" aria-label="あおみどり"></button><button class="swatch" data-color="#90e0ef" style="background:#90e0ef" aria-label="みずいろ"></button><button class="swatch" data-color="#4361ee" style="background:#4361ee" aria-label="あおむらさき"></button><button class="swatch" data-color="#c77dff" style="background:#c77dff" aria-label="うすむらさき"></button><button class="swatch" data-color="#f4acb7" style="background:#f4acb7" aria-label="うすピンク"></button><button class="swatch" data-color="#9d4edd" style="background:#9d4edd" aria-label="あざやかなむらさき"></button>
</div>
<div class="actions"><button class="primary" id="registerBtn">A のモンスターを登録！</button></div><p class="small" id="drawHint">絵をかいたら「登録！」をおしてね。</p>
</section>
<section class="panel"><h2>② バトルするモンスター</h2><div class="saved">
<div class="fighter-card a"><h3 id="savedNameA">A：まだ未登録</h3><canvas id="savedA"></canvas><div class="small" id="statusA">お絵描きして登録しよう</div></div>
<div class="fighter-card b"><h3 id="savedNameB">B：まだ未登録</h3><canvas id="savedB"></canvas><div class="small" id="statusB">お絵描きして登録しよう</div></div>
</div><div class="actions"><button class="secondary" id="editABtn">A をかきなおす</button><button class="secondary" id="editBBtn">B をかきなおす</button></div></section>
<section class="battle">
<h2>③ モンスター バトル！</h2>
<div class="actions"><button class="secondary" id="soundBtn">効果音をON／テスト</button><span class="small" id="soundStatus">効果音：未確認</span></div>
<div class="arena" id="arena">
<div class="cloud" style="left:18%"></div><div class="cloud" style="right:16%;top:23%"></div><div class="hill" style="left:-25px"></div><div class="hill" style="right:-35px;height:80px"></div><div class="ground"></div>

<div class="hp-wrap a"><div class="hp-label" id="hpLabelA">A HP 100</div><div class="hp-track"><div class="hp-fill" id="hpFillA"></div></div></div>
<div class="hp-wrap b"><div class="hp-label" id="hpLabelB">B HP 100</div><div class="hp-track"><div class="hp-fill" id="hpFillB"></div></div></div>
<div class="unit a" id="unitA"><canvas id="battleA"></canvas></div><div class="unit b" id="unitB"><canvas id="battleB"></canvas></div>
<div class="hit-text" id="hitText">ドカッ！</div>
</div>
<div class="battle-status" id="battleStatus" aria-live="polite">AとBを登録するとバトルできるよ！</div>
<div class="actions"><button class="primary" id="battleBtn" disabled>バトル開始！</button><button class="secondary" id="resetBattleBtn" disabled>もういちど</button><button class="secondary" id="downloadBtn">ゲームを保存</button></div>
<div class="result" id="result" aria-live="polite">モンスターを2体登録してね。</div>
<p class="small">モンスターは自動で前進して攻撃します。HPが0になったモンスターの負け！</p>
</section>
<p class="small" style="text-align:center">登録した絵は、このブラウザ内に保存されます。</p>
</div>
<script>
(()=>{
const $=id=>document.getElementById(id),draw=$('drawCanvas'),ctx=draw.getContext('2d');
let current='A',color='#263044',erasing=false,drawing=false,last=null,history=[],fighters={A:null,B:null};
let brushSize=5;
let battleTimer=null,battleState=null;
const ratio=()=>Math.max(1,window.devicePixelRatio||1);
function setup(canvas,height){
 const w=Math.max(1,Math.round(canvas.clientWidth||300)),h=Math.max(1,Math.round(height||canvas.clientHeight||150)),r=ratio();
 canvas.width=Math.round(w*r);canvas.height=Math.round(h*r);
 const c=canvas.getContext('2d');c.setTransform(r,0,0,r,0,0);c.globalCompositeOperation='source-over';c.clearRect(0,0,w,h);
 if(canvas!==draw){c.fillStyle='#fff';c.fillRect(0,0,w,h);}c.lineCap='round';c.lineJoin='round';
}
function fitDraw(){setup(draw,draw.clientHeight||270);}
function snapshot(){try{history.push(draw.toDataURL('image/png'));if(history.length>30)history.shift();}catch(e){}}
function renderImage(data,canvas){
 const c=canvas.getContext('2d'),battle=canvas.id==='battleA'||canvas.id==='battleB';
 const prepare=()=>{
  const w=Math.max(1,canvas.clientWidth||300),h=Math.max(1,canvas.clientHeight||150),r=ratio();
  const bw=Math.round(w*r),bh=Math.round(h*r);
  if(canvas.width!==bw)canvas.width=bw;if(canvas.height!==bh)canvas.height=bh;
  c.setTransform(r,0,0,r,0,0);c.clearRect(0,0,w,h);
  if(!battle){c.fillStyle='#fff';c.fillRect(0,0,w,h);}
  return {w,h};
 };
 prepare();if(!data)return;
 const img=new Image();
 img.onload=()=>{
  const {w,h}=prepare(),iw=img.naturalWidth||img.width,ih=img.naturalHeight||img.height;
  if(!iw||!ih)return;
  const scale=Math.min(w/iw,h/ih),dw=iw*scale,dh=ih*scale;
  c.drawImage(img,0,0,iw,ih,(w-dw)/2,(h-dh)/2,dw,dh);
 };
 img.onerror=()=>console.error('モンスター画像を読み込めませんでした');
 img.src=data;
}
function setEditor(which){current=which;erasing=false;$('penBtn').classList.add('active');$('eraserBtn').classList.remove('active');$('drawTitle').textContent=`${which==='A'?'①':'②'} プレイヤー ${which} の絵をかこう`;$('fighterName').value=fighters[which]?.name||(which==='A'?'プレイヤー A':'プレイヤー B');$('registerBtn').textContent=`${which} のモンスターを登録！`;history=[];fitDraw();if(fighters[which])renderImage(fighters[which].image,draw);else{ctx.setTransform(ratio(),0,0,ratio(),0,0);ctx.clearRect(0,0,draw.clientWidth,draw.clientHeight);}snapshot();}
function pos(e){const r=draw.getBoundingClientRect();return{x:(e.clientX-r.left)*(draw.clientWidth/r.width),y:(e.clientY-r.top)*(draw.clientHeight/r.height)};}
draw.addEventListener('pointerdown',e=>{
 e.preventDefault();
 drawing=true;
 try{draw.setPointerCapture(e.pointerId);}catch(err){}
 last=pos(e);snapshot();
 ctx.save();
 ctx.globalCompositeOperation=erasing?'destination-out':'source-over';
 ctx.fillStyle=color;ctx.strokeStyle=color;ctx.lineCap='round';ctx.lineJoin='round';
 ctx.beginPath();ctx.arc(last.x,last.y,erasing?brushSize*2.5:brushSize/2,0,Math.PI*2);ctx.fill();
 ctx.restore();
});
draw.addEventListener('pointermove',e=>{
 if(!drawing||!last)return;
 e.preventDefault();
 const p=pos(e);
 ctx.save();
 ctx.globalCompositeOperation=erasing?'destination-out':'source-over';
 ctx.strokeStyle=color;ctx.lineWidth=erasing?brushSize*5:brushSize;ctx.lineCap='round';ctx.lineJoin='round';
 ctx.beginPath();ctx.moveTo(last.x,last.y);ctx.lineTo(p.x,p.y);ctx.stroke();
 ctx.restore();last=p;
});
function stopDraw(){drawing=false;last=null;}draw.addEventListener('pointerup',stopDraw);draw.addEventListener('pointercancel',stopDraw);
$('penBtn').onclick=()=>{erasing=false;$('penBtn').classList.add('active');$('eraserBtn').classList.remove('active');};
$('eraserBtn').onclick=()=>{erasing=true;$('eraserBtn').classList.add('active');$('penBtn').classList.remove('active');};

function setBrushSize(size,activeId){brushSize=size;['sizeThinBtn','sizeMidBtn','sizeBoldBtn'].forEach(id=>{if($(id))$(id).classList.toggle('active',id===activeId);});}
if($('sizeThinBtn'))$('sizeThinBtn').onclick=()=>setBrushSize(2,'sizeThinBtn');
if($('sizeMidBtn'))$('sizeMidBtn').onclick=()=>setBrushSize(5,'sizeMidBtn');
if($('sizeBoldBtn'))$('sizeBoldBtn').onclick=()=>setBrushSize(12,'sizeBoldBtn');
const brushSizeRange=$('brushSizeRange'),brushSizeValue=$('brushSizeValue');
if(brushSizeRange){
 brushSizeRange.addEventListener('input',()=>{
  brushSize=Number(brushSizeRange.value);
  if(brushSizeValue)brushSizeValue.textContent=String(brushSize);
  ['sizeThinBtn','sizeMidBtn','sizeBoldBtn'].forEach(id=>{if($(id))$(id).classList.remove('active');});
 });
}
$('undoBtn').onclick=()=>{if(history.length<=1)return;history.pop();const img=new Image();img.onload=()=>{ctx.setTransform(ratio(),0,0,ratio(),0,0);ctx.clearRect(0,0,draw.clientWidth,draw.clientHeight);ctx.clearRect(0,0,draw.clientWidth,draw.clientHeight);ctx.drawImage(img,0,0,draw.clientWidth,draw.clientHeight);};img.src=history[history.length-1];};
$('clearBtn').onclick=()=>{snapshot();ctx.setTransform(ratio(),0,0,ratio(),0,0);ctx.clearRect(0,0,draw.clientWidth,draw.clientHeight);};
document.querySelectorAll('.swatch').forEach(b=>b.onclick=()=>{color=b.dataset.color;erasing=false;document.querySelectorAll('.swatch').forEach(x=>x.classList.toggle('active',x===b));$('penBtn').classList.add('active');$('eraserBtn').classList.remove('active');});
function updateSaved(which){const f=fighters[which];$('savedName'+which).textContent=f?`${which}：${f.name}`:`${which}：まだ未登録`;$('status'+which).textContent=f?`登録ずみ！ 攻撃力 ${f.attackPower??10}`:'お絵描きして登録しよう';renderImage(f?.image,$('saved'+which));renderImage(f?.image,$('battle'+which));$('battleBtn').disabled=!(fighters.A&&fighters.B);$('resetBattleBtn').disabled=!(fighters.A&&fighters.B);if(!(fighters.A&&fighters.B))$('battleStatus').textContent='AとBを登録するとバトルできるよ！';}
$('registerBtn').onclick=()=>{
 const nw=Math.max(1,Math.round(draw.clientWidth)),nh=Math.max(1,Math.round(draw.clientHeight));
 const normalized=document.createElement('canvas');normalized.width=nw;normalized.height=nh;
 const nctx=normalized.getContext('2d');
 nctx.drawImage(draw,0,0,draw.width,draw.height,0,0,nw,nh);
 // 透明ではないピクセル数から描画面積を測定し、攻撃力だけに反映する。
 const pixels=nctx.getImageData(0,0,nw,nh).data;
 let paintedPixels=0;
 for(let i=3;i<pixels.length;i+=4){if(pixels[i]>0)paintedPixels++;}
 const areaRatio=paintedPixels/(nw*nh);
 const attackPower=Math.max(5,Math.min(20,Math.round(5+areaRatio*250)));
 fighters[current]={name:$('fighterName').value.trim()||`プレイヤー ${current}`,image:normalized.toDataURL('image/png'),attackPower};try{localStorage.setItem('oekakiMonsterBattle',JSON.stringify(fighters));}catch(e){$('drawHint').textContent='保存容量がいっぱいです。';}updateSaved(current);if(current==='A'){setEditor('B');$('drawHint').textContent='Aの登録OK！つぎはBをかこう。';}else{$('drawHint').textContent='Bの登録OK！バトル開始！';$('result').textContent='準備OK！バトル開始を押してね。';}};
$('editABtn').onclick=()=>setEditor('A');$('editBBtn').onclick=()=>setEditor('B');
// 効果音：音声再生はユーザーがボタンを押した操作内で有効化する。
let gameAudio=null;
async function enableGameAudio(){
 const AC=window.AudioContext||window.webkitAudioContext;
 if(!AC) throw new Error('このブラウザは音声生成に対応していません');
 if(!gameAudio) gameAudio=new AC();
 if(gameAudio.state!=='running') await gameAudio.resume();
 if(gameAudio.state!=='running') throw new Error('音声が有効になりませんでした');
 return gameAudio;
}
function gameSound(type){
 if(!gameAudio||gameAudio.state!=='running') return;
 const ac=gameAudio,t=ac.currentTime;
 const beep=(f1,f2,d,wave='triangle',vol=.16,delay=0)=>{
  const o=ac.createOscillator(),g=ac.createGain();
  o.type=wave;o.frequency.setValueAtTime(f1,t+delay);
  if(f1!==f2)o.frequency.exponentialRampToValueAtTime(Math.max(20,f2),t+delay+d);
  g.gain.setValueAtTime(.0001,t+delay);g.gain.exponentialRampToValueAtTime(vol,t+delay+.01);g.gain.exponentialRampToValueAtTime(.0001,t+delay+d);
  o.connect(g);g.connect(ac.destination);o.start(t+delay);o.stop(t+delay+d+.03);
 };
 if(type==='transform'){beep(180,420,.35,'sawtooth',.12);beep(300,850,.42,'triangle',.13,.12);beep(500,1000,.25,'sine',.12,.3);}
 else if(type==='attack'){beep(190,55,.18,'sawtooth',.22);beep(700,160,.10,'square',.1,.015);}
 else if(type==='win'){beep(523,523,.16,'triangle',.14);beep(659,659,.16,'triangle',.14,.17);beep(784,784,.18,'triangle',.14,.34);beep(1047,1047,.36,'triangle',.16,.53);}
 else if(type==='draw'){beep(280,180,.25,'sine',.12);beep(220,130,.32,'triangle',.11,.2);}
}
$('soundBtn').addEventListener('click',async()=>{
 const status=$('soundStatus');
 try{await enableGameAudio();gameSound('attack');status.textContent='効果音：ON（テスト音を再生しました）';}
 catch(e){status.textContent='効果音を有効にできません。端末の消音・音量を確認してください。';}
});
function updateHp(side){const hp=battleState.hp[side],max=battleState.maxHp,fill=$('hpFill'+side);$('hpLabel'+side).textContent=`${fighters[side].name} HP ${Math.max(0,hp)}`;fill.style.width=`${Math.max(0,hp)/max*100}%`;fill.style.background=hp>max*.55?'#5cdb75':hp>max*.25?'#ffd85b':'#ff5368';}
function clearBattle(){if(battleTimer){clearInterval(battleTimer);battleTimer=null;}['unitA','unitB'].forEach(id=>$(id).classList.remove('damage','attack-a','attack-b','victory','transforming','evolved','power-attack','knockback'));$('arena').classList.remove('flash');$('hitText').classList.remove('power');$('hitText').classList.remove('show');}
function resetBattle(){clearBattle();if(!(fighters.A&&fighters.B))return;const arena=$('arena'),w=arena.clientWidth;const firstAttacker=Math.random()<0.5?'A':'B';battleState={hp:{A:100,B:100},maxHp:100,pos:{A:w*.17,B:w*.83},lastAttack:{A:firstAttacker==='A'?0:3,B:firstAttacker==='B'?0:3},tick:0,done:false,firstAttacker};$('unitA').style.left='17%';$('unitA').style.right='auto';$('unitB').style.right='17%';$('unitB').style.left='auto';$('unitA').style.transform='';$('unitB').style.transform='';updateHp('A');updateHp('B');$('battleStatus').textContent='モンスターが出撃！相手にむかって進むよ！';$('result').textContent='バトル中！';$('battleBtn').disabled=true;$('resetBattleBtn').disabled=false;
battleTimer=setInterval(stepBattle,120);}
function showHit(text){const el=$('hitText');el.textContent=text;el.classList.remove('show');void el.offsetWidth;el.classList.add('show');}
function stepBattle(){if(!battleState||battleState.done)return;const s=battleState,arena=$('arena'),w=arena.clientWidth,unitWidth=Math.min(w*.3,205),meetA=w*.5-unitWidth*.72,meetB=w*.5+unitWidth*.05;s.tick++;
// Walk inward until they reach each other.
if(s.pos.A<meetA)s.pos.A+=Math.max(2,w*.012);
if(s.pos.B>meetB)s.pos.B-=Math.max(2,w*.012);
$('unitA').style.left=`${s.pos.A/w*100}%`;$('unitA').style.right='auto';$('unitB').style.left='auto';$('unitB').style.right=`${(w-s.pos.B)/w*100}%`;
const close=s.pos.B-s.pos.A<unitWidth*.95;

if(close&&!s.transformed){
 s.transformed=true;
 gameSound('transform');
 ['A','B'].forEach(side=>{$('unit'+side).classList.add('transforming');$('unit'+side).classList.remove('flip-spin');void $('unit'+side).offsetWidth;$('unit'+side).classList.add('flip-spin');});
 $('battleStatus').textContent='モンスターが パワーアップ！';
 showHit('へんしん！');$('hitText').classList.add('power');$('arena').classList.add('flash');
 setTimeout(()=>{if(battleState){['A','B'].forEach(side=>{$('unit'+side).classList.remove('transforming','flip-spin');$('unit'+side).classList.add('evolved');});$('arena').classList.remove('flash');$('hitText').classList.remove('power');}},950);
 return;
}
if(close){
 const order=(s.firstAttacker==='A'?['A','B']:['B','A']);
 for(const side of order){
  if(s.hp[side]<=0)continue;
  if(s.tick-s.lastAttack[side]>=7){
   s.lastAttack[side]=s.tick;
   const target=side==='A'?'B':'A';
   const damage=Math.max(5,Math.min(20,Math.round(fighters[side].attackPower??10)));
   $('unit'+side).classList.remove('attack-a','attack-b');void $('unit'+side).offsetWidth;$('unit'+side).classList.add(side==='A'?'attack-a':'attack-b');
   $('unit'+target).classList.remove('damage');void $('unit'+target).offsetWidth;$('unit'+target).classList.add('damage');
   s.hp[target]=Math.max(0,s.hp[target]-damage);updateHp(target);gameSound('attack');showHit(`ドカッ！ -${damage}`);
   $('battleStatus').textContent=`${fighters[side].name} のこうげき！`;
   if(s.hp[target]===0){finishBattle(side,target);return;}
  }
 }
}}
function finishBattle(winner,loser){if(!battleState)return;battleState.done=true;gameSound(winner==='draw'?'draw':'win');if(battleTimer){clearInterval(battleTimer);battleTimer=null;}if(winner==='draw'){$('battleStatus').textContent='両方のモンスターがたおれた！';$('result').textContent='ひきわけ！';}else{$('unit'+winner).classList.add('victory');$('battleStatus').textContent=`${fighters[loser].name} がたおれた！`;$('result').textContent=`🏆 ${fighters[winner].name} の かち！`;}$('battleBtn').disabled=false;$('battleBtn').textContent='もういちどバトル！';}
$('battleBtn').onclick=()=>{if(!(fighters.A&&fighters.B))return;clearBattle();$('battleBtn').textContent='バトル中…';resetBattle();};
$('resetBattleBtn').onclick=()=>{clearBattle();$('battleBtn').textContent='バトル開始！';resetBattle();};
$('resetBattleBtn').disabled=true;
$('resetBattleBtn').textContent='最初から戦う';
$('resetBattleBtn').onclick=()=>{clearBattle();$('battleBtn').textContent='バトル開始！';resetBattle();};
$('resetBattleBtn').disabled=true;
$('resetBattleBtn').textContent='もういちど';
$('resetBtn')?.addEventListener('click',()=>{clearBattle();fighters={A:null,B:null};try{localStorage.removeItem('oekakiMonsterBattle');}catch(e){}updateSaved('A');updateSaved('B');setEditor('A');});
$('downloadBtn').onclick=()=>{
 const blob=new Blob(['<!doctype html>\\n'+document.documentElement.outerHTML],{type:'text/html;charset=utf-8'});
 const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='oekaki_monster_battle.html';
 document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);
};
try{const saved=JSON.parse(localStorage.getItem('oekakiMonsterBattle')||'null');if(saved&&typeof saved==='object')fighters={A:saved.A||null,B:saved.B||null};}catch(e){}
function init(){fitDraw();updateSaved('A');updateSaved('B');setEditor(fighters.A&&!fighters.B?'B':'A');}
let resizeTimer;window.addEventListener('resize',()=>{clearTimeout(resizeTimer);resizeTimer=setTimeout(()=>{const data=draw.toDataURL('image/png');fitDraw();renderImage(data,draw);},150);});
init();
})();
